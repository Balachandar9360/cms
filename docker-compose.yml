version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: canteen_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-canteen_db}
      MYSQL_USER: ${MYSQL_USER:-canteen_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-canteen_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - canteen-network

  # Backend API
  backend:
    build:
      context: ./canteen-system-backend
      dockerfile: Dockerfile
    container_name: canteen_backend
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-canteen_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExists=true
      DATABASE_USERNAME: ${MYSQL_USER:-canteen_user}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-canteen_pass}
      FRONTEND_URL: http://${FRONTEND_HOST:-localhost}:${FRONTEND_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-K8pQ2xR9mN4vL7wZ3jH6tY1sD5fG0aB8cE2nM9pQ4rT7uW1xZ6yC3vB5nM8kL2j}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-your-email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your-app-password}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - canteen-network
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: ./canteen-system-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://${BACKEND_HOST:-backend}:${BACKEND_PORT:-8080}
    container_name: canteen_frontend
    environment:
      VITE_API_BASE_URL: http://${BACKEND_HOST:-localhost}:${BACKEND_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - canteen-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  canteen-network:
    driver: bridge
